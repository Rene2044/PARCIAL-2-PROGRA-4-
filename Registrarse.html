<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Registrarse</title>
    <link rel="icon" type="image/png" href="assets/Cap.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600&family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="js/Estilos.css">

    <style>
        /* Estilos Globales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* Fondo unificado con el ecosistema SkyCast */
        .weather-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
        }

        /* Contenedor de la tarjeta con Glassmorphism (Idéntico al Login) */
        .login-card {
            width: 900px;
            max-width: 90%;
            height: 600px; /* Altura ideal para albergar los campos cómodamente */
            display: flex;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            margin-top: 100px; 
            margin-bottom: 40px;
        }

        /* Panel Izquierdo (Imagen/Ilustración) */
        .left-panel {
            flex: 1;
            background-color: transparent;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        .illustration-container {
            width: 250px;
            height: 250px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Panel Derecho (Formulario) */
        .right-panel {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Estilos de Texto */
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Estilos del Formulario */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Botón Registrarse (Naranja principal) */
        .login-button {
            width: 100%;
            padding: 13px;
            background-color: #ff643c;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .login-button:hover {
            background-color: #ff4c24;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 100, 60, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Botón Variante (Volver al Login) */
        .login-button-alt {
            background-color: transparent;
            border: 2px solid #ff643c;
            color: #ff643c;
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .login-button-alt:hover {
            background-color: rgba(255, 100, 60, 0.05);
            color: #ff4c24;
            border-color: #ff4c24;
        }
    </style>
</head>
<body class="weather-bg flex flex-col items-center min-h-screen p-0 m-0 w-full overflow-x-hidden">

    <header id="navbar-app" class="w-full"></header>

    <div class="login-card">
        <div class="left-panel flex items-center justify-center p-8">
            <div class="illustration-container flex items-center justify-center w-full h-full">
                <img src="assets/montaña1.png" 
                     alt="Ilustración SkyCast" 
                     class="w-full h-full max-w-64 max-h-64 object-contain drop-shadow-2xl transition-transform duration-500 hover:scale-105">
            </div>
        </div>

        <div class="right-panel">
            <div>
                <h1>Crea tu cuenta</h1>

                <form>
                    <div class="input-group">
                        <label for="reg-username" class="input-label">Usuario</label>
                        <input type="text" id="reg-username" class="input-field" placeholder="Crea un nombre de usuario" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-email" class="input-label">Correo Electrónico</label>
                        <input type="email" id="reg-email" class="input-field" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-password" class="input-label">Contraseña</label>
                        <input type="password" id="reg-password" class="input-field" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="input-group mb-6">
                        <label for="confirm-password" class="input-label">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" class="input-field" placeholder="Repite tu contraseña" required>
                    </div>

                    <button type="submit" class="login-button">Registrarse</button>
                    
                    <a href="login.html" class="login-button-alt">¿Ya tienes cuenta? Inicia Sesión</a>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer-app" class="w-full"></footer>

    <script type="module" src="js/Navbar.js"></script>
    <script type="module" src="js/Footer.js"></script>
</body>
</html>
